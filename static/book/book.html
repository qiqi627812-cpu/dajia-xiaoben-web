<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>大家小本</title>
<meta name="referrer" content="no-referrer">
<meta name="description" content="大家小本——一本软软的共享手账" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='44' rx='12' fill='%23BCCBAD'/%3E%3Cpath d='M24 30c3 3 8 3 11 0M40 30c-3 3-8 3-11 0' stroke='%2355655B' stroke-width='3.4' stroke-linecap='round' fill='none'/%3E%3Cpath d='M30 38l4 0-2 3z' fill='%23D89C97'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/style.css?v=1032a" />
</head>
<body>
<img id="bg" src="assets/asset-03.png" alt="" aria-hidden="true" />

<div id="app">
  <header id="topnav">
    <nav class="links" aria-label="主导航">
      <a href="#" data-nav="账本">账本</a>
      <a href="#" data-nav="成员">成员</a>
      <a href="#" data-nav="记一笔">记一笔</a>
      <a href="#" data-nav="明细">明细</a>
      <a href="#" data-nav="结算">结算</a>
    </nav>
  </header>

  <main id="stage">
    <canvas id="gl" aria-hidden="true"></canvas>

    <svg id="ribbon" viewBox="0 0 14 44" aria-hidden="true">
      <path d="M3 0 C1.6 12 5 20 2.8 30 L3.4 30 L7 37 L10.6 30 L11.2 30 C9 20 12.4 12 11 0 Z" fill="#D8A6A0"/>
      <path d="M4.4 1 C3.4 11 6.4 18 5 28" stroke="#C08F8A" stroke-width="1" fill="none" opacity="0.75"/>
      <path d="M8.2 1 C7.6 11 9.4 18 8.6 28" stroke="#E7BCB7" stroke-width="0.8" fill="none" opacity="0.5"/>
    </svg>

    <button class="flipbtn" id="btnPrev" type="button" aria-label="上一页（即将开放）" disabled>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="flipbtn" id="btnNext" type="button" aria-label="下一页（即将开放）" disabled>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div id="panelWrap" hidden>
      <section id="profilePanel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
        <div class="card">
          <header class="p-head">
            <h2 id="panelTitle">画个头像</h2>
            <p class="sub">给自己起个名字、画个小头像，资料只保存在这台设备上。</p>
          </header>
          <div class="p-body">
            <label class="field">
              <span class="field-label">昵称</span>
              <input id="nickInput" type="text" maxlength="12" placeholder="比如：小满" autocomplete="off" enterkeyhint="done" />
            </label>
            <div class="canvas-wrap">
              <canvas id="draw" width="320" height="320" aria-label="头像画板"></canvas>
            </div>
            <div class="tools">
              <div class="tool-group seg" role="group" aria-label="工具">
                <button type="button" class="tbtn" id="toolBrush" aria-label="画笔" title="画笔">
                  <svg viewBox="0 0 24 24" width="17" height="17"><path d="M4 20c.5-3 1.5-4.5 3-6l9.5-9.5a2.1 2.1 0 0 1 3 3L10 17c-1.5 1.5-3 2.5-6 3z" fill="currentColor"/></svg>
                </button>
                <button type="button" class="tbtn" id="toolEraser" aria-label="橡皮" title="橡皮">
                  <svg viewBox="0 0 24 24" width="17" height="17"><path d="M9 19 3.5 13.5a2 2 0 0 1 0-2.8l7.2-7.2a2 2 0 0 1 2.8 0l5 5a2 2 0 0 1 0 2.8L13.5 19H9z" fill="currentColor"/><path d="M9 19h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
              </div>
              <div class="tool-group colors" id="colors" role="group" aria-label="颜色"></div>
              <div class="tool-group sizes" id="sizes" role="group" aria-label="画笔粗细">
                <button type="button" class="tbtn sz" data-size="4" aria-label="细笔"><i class="dotp s"></i></button>
                <button type="button" class="tbtn sz on" data-size="10" aria-label="中笔"><i class="dotp m"></i></button>
                <button type="button" class="tbtn sz" data-size="20" aria-label="粗笔"><i class="dotp l"></i></button>
              </div>
              <div class="tool-group acts" role="group" aria-label="操作">
                <button type="button" class="tbtn" id="undoBtn" aria-label="撤销" title="撤销" disabled>
                  <svg viewBox="0 0 24 24" width="17" height="17"><path d="M8 5 3 10l5 5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.8 10H14a6 6 0 1 1 0 12h-3" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
                </button>
                <button type="button" class="tbtn" id="redoBtn" aria-label="重做" title="重做" disabled>
                  <svg viewBox="0 0 24 24" width="17" height="17"><path d="M16 5l5 5-5 5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.2 10H10a6 6 0 1 0 0 12h3" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
                </button>
                <button type="button" class="tbtn" id="clearBtn" aria-label="清空" title="清空">
                  <svg viewBox="0 0 24 24" width="17" height="17"><path d="M4 7h16M9 7V4.5h6V7m-9 0 1 13h10l1-13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </div>
            <button type="button" class="ghost-btn" id="defaultAvatarBtn">使用默认头像</button>
          </div>
          <footer class="p-foot">
            <button type="button" class="primary" id="enterBtn">进入大家小本</button>
          </footer>
        </div>
      </section>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
  </main>
</div>

<script type="module" src="assets/app.js?v=1032a"></script>
</body>
</html>
